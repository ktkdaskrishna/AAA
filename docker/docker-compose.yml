version: "3.9"
services:
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    env_file:
      - ../.env
    expose:
      - "8080"
    volumes:
      - axiom_audit:/var/log/axiom
    restart: unless-stopped

  reverse-proxy:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    depends_on:
      - gateway
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  axiom_audit:
