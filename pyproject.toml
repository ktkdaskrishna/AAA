[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securado-axiom"
version = "0.1.0"
description = "Securado Axiom security control validation MVP"
readme = "securado_axiom/README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["securado_axiom*"]

[tool.pytest.ini_options]
testpaths = ["securado_axiom/gateway/tests"]
